<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>یلدا مبارک</title>
  <meta name="description" content="کارت پستال تبریک شب یلدا">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <svg class="bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="pom">
        <path d="M-7,-23 L-11,-37 L-4,-30 L0,-39 L4,-30 L11,-37 L7,-23 Z" fill="#8e0b22"/>
        <circle r="26" fill="#c8102e"/>
        <path d="M-17,-8 a20,20 0 0 1 11,-11" stroke="#ff9aa8" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".7"/>
      </g>

      <g id="pom-half">
        <circle r="26" fill="#c8102e"/>
        <circle r="21" fill="#f6dfc8"/>
        <g fill="#c8102e">
          <ellipse cx="0" cy="-12" rx="4" ry="5.5"/>
          <ellipse cx="-10" cy="-6" rx="4" ry="5.5" transform="rotate(-40 -10 -6)"/>
          <ellipse cx="10" cy="-6" rx="4" ry="5.5" transform="rotate(40 10 -6)"/>
          <ellipse cx="-11" cy="7" rx="4" ry="5.5" transform="rotate(-120 -11 7)"/>
          <ellipse cx="11" cy="7" rx="4" ry="5.5" transform="rotate(120 11 7)"/>
          <ellipse cx="0" cy="13" rx="4" ry="5.5"/>
          <circle r="3.5"/>
        </g>
      </g>

      <g id="date">
        <rect x="-2.5" y="-30" width="5" height="8" rx="2" fill="#c9a15a"/>
        <ellipse rx="11" ry="24" fill="#6b3410"/>
        <path d="M-5,-14 q-3,14 0,28" stroke="#a5622a" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".8"/>
        <path d="M4,-10 q2,10 0,20" stroke="#40200a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <g id="melon">
        <path d="M-28,0 A28,28 0 0 0 28,0 Z" fill="#2f7d3b"/>
        <path d="M-24,0 A24,24 0 0 0 24,0 Z" fill="#f6dfc8"/>
        <path d="M-21,0 A21,21 0 0 0 21,0 Z" fill="#e23b4e"/>
        <g fill="#2a0f14">
          <ellipse cx="-10" cy="6" rx="1.6" ry="2.6"/>
          <ellipse cx="0" cy="11" rx="1.6" ry="2.6"/>
          <ellipse cx="10" cy="6" rx="1.6" ry="2.6"/>
        </g>
      </g>

      <path id="star" d="M0,-6 L1.6,-1.6 L6,0 L1.6,1.6 L0,6 L-1.6,1.6 L-6,0 L-1.6,-1.6 Z" fill="#f3d48a"/>

      <pattern id="yalda" width="260" height="260" patternUnits="userSpaceOnUse">
        <use href="#pom" transform="translate(50 60) rotate(-12)"/>
        <use href="#date" transform="translate(150 50) rotate(35)"/>
        <use href="#melon" transform="translate(220 120) rotate(-20)"/>
        <use href="#pom-half" transform="translate(120 150) rotate(15)"/>
        <use href="#date" transform="translate(40 180) rotate(-30)"/>
        <use href="#date" transform="translate(68 196) rotate(-8)"/>
        <use href="#pom" transform="translate(200 220) rotate(18) scale(.8)"/>
        <use href="#star" transform="translate(100 30)"/>
        <use href="#star" transform="translate(210 40) scale(.7)"/>
        <use href="#star" transform="translate(20 115) scale(.8)"/>
        <use href="#star" transform="translate(170 100) scale(.6)"/>
        <use href="#star" transform="translate(130 225)"/>
        <use href="#star" transform="translate(245 185) scale(.7)"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#yalda)"/>
  </svg>

  <main class="card">
    <svg class="emblem" viewBox="-40 -44 80 80" aria-hidden="true">
      <use href="#pom" transform="scale(1.25)"/>
    </svg>
    <h1>یلدا مبارک</h1>
    <p class="sub">بلندترین شب سال</p>
    <p class="wish">
      شب یلدایتان پر از انار و خرما،<br>
      گرمای دورهمی و لبخند.
    </p>
    <hr class="divider">
    <p class="sign">با بهترین آرزوها</p>
  </main>

</body>
</html>
